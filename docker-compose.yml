services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: voltwatch
      POSTGRES_PASSWORD: voltwatch
      POSTGRES_DB: voltwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltwatch"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
